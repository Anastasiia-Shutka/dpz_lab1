<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HandyScope App - Patients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Patient Management</h1>
        <div>
            <form action="/import" method="post" style="display:inline;">
                <button type="submit" class="btn btn-outline-primary me-2">Import CSV</button>
            </form>
            <a href="/add" class="btn btn-primary">Add New Patient</a>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in patients %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td>{{ p.full_name }}</td>
                        <td>{{ p.dob }}</td>
                        <td>{{ p.gender }}</td>
                        <td class="text-end">
                            <a href="/edit/{{ p.id }}" class="btn btn-outline-secondary btn-sm">Edit</a>
                            <form action="/delete/{{ p.id }}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
